name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_PATH: ${{ matrix.base-path }}
    strategy:
      fail-fast: false
      matrix:
        next-version:
          [
            "14.0",
            "14.1",
            "14.2",
            "15.0",
            "15.1",
            "15.2",
            "15.3",
            "15.4",
            "15.5",
            "16.0",
            "16.1",
            "16.2",
            "16.3",
          ]
        node-version: [22]
        base-path: [""]
        include:
          - next-version: "14.0"
            react-version: "18"
          - next-version: "14.1"
            react-version: "18"
          - next-version: "14.2"
            react-version: "18"
          - next-version: "14.2"
            node-version: 22
            react-version: "18"
            base-path: "/docs"
          - next-version: "15.5"
            node-version: 22
            base-path: "/docs"
          - next-version: "16.3"
            node-version: 22
            base-path: "/docs"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Update Next.js version in example
        run: pnpm add next@~${{ matrix.next-version }} react@${{ matrix.react-version || '19' }} react-dom@${{ matrix.react-version || '19' }} --save-exact
        working-directory: example

      - name: Build example app
        run: pnpm build
        working-directory: example

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps --only-shell

      - name: Run Playwright tests
        run: PLAYWRIGHT_PRODUCTION=1 pnpm exec playwright test

      - name: Summarize browser results
        if: ${{ !cancelled() }}
        run: node scripts/summarize-playwright.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-next-${{ matrix.next-version }}${{ matrix.base-path && '-base-path' || '' }}
          path: playwright-report/
          retention-days: 30

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: node --test scripts/validate-release.test.mjs
      - run: pnpm build
      - run: git diff --exit-code -- dist
      - run: pnpm check:packaging
      - run: pnpm --dir website build

  compatibility:
    if: always()
    needs: [test, packaging]
    runs-on: ubuntu-latest
    steps:
      - run: test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.packaging.result }}
